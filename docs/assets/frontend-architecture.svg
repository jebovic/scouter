<svg viewBox="0 0 880 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      @keyframes fade-cycle {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      @keyframes slide-in {
        0% { transform: translateX(-4px); opacity: 0.6; }
        50% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(-4px); opacity: 0.6; }
      }
      @keyframes pulse-ring {
        0% { stroke-width: 1.5; opacity: 1; }
        50% { stroke-width: 3; opacity: 0.6; }
        100% { stroke-width: 1.5; opacity: 1; }
      }
      .page-box { animation: fade-cycle 3s ease-in-out infinite; }
      .hook-box { animation: fade-cycle 2.5s ease-in-out infinite 0.3s; }
      .api-box { animation: pulse-ring 2s ease-in-out infinite; }
      .t { font-size: 11px; fill: #f8fafc; font-weight: 600; text-anchor: middle; }
      .s { font-size: 9px; fill: #94a3b8; text-anchor: middle; }
      .layer-t { font-size: 10px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#162032"/>
    </linearGradient>
    <marker id="a4" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#60a5fa"/>
    </marker>
    <marker id="a4-p" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#a78bfa"/>
    </marker>
    <marker id="a4-g" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="url(#bg4)" rx="12"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#f8fafc">Frontend Architecture</text>
  <text x="440" y="52" text-anchor="middle" font-size="11" fill="#64748b">React 19 · Vite · TypeScript · Tanstack Query v5 · React Router v7</text>

  <!-- ====== ROW 1: Router + Layout ====== -->
  <text x="30" y="78" class="layer-t">Routing Layer</text>

  <rect x="30" y="86" width="820" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="440" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#c4b5fd">React Router v7 — Outlet Pattern</text>
  <text x="440" y="126" text-anchor="middle" font-size="10" fill="#64748b">
    / (Layout) → /missions/:slug (MissionLayout) → /missions/:slug/options | /shopping | /search | /history | /stats | /settings | …
  </text>

  <!-- ====== ROW 2: Pages ====== -->
  <text x="30" y="158" class="layer-t">Pages (22)</text>

  <!-- Group 1: Mission -->
  <rect x="30" y="165" width="130" height="95" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" class="page-box"/>
  <text x="95" y="185" class="t">Mission</text>
  <text x="95" y="202" class="s">HQ Dashboard</text>
  <text x="95" y="216" class="s">Mission Overview</text>
  <text x="95" y="230" class="s">Options Explorer</text>
  <text x="95" y="244" class="s">Kanban Board</text>

  <!-- Group 2: Shopping -->
  <rect x="170" y="165" width="130" height="95" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5" class="page-box"/>
  <text x="235" y="185" class="t">Shopping</text>
  <text x="235" y="202" class="s">Shopping Tracker</text>
  <text x="235" y="216" class="s">History Page</text>
  <text x="235" y="230" class="s">Deal Calendar</text>
  <text x="235" y="244" class="s">Cashback Page</text>

  <!-- Group 3: Analytics -->
  <rect x="310" y="165" width="130" height="95" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.5" class="page-box"/>
  <text x="375" y="185" class="t">Analytics</text>
  <text x="375" y="202" class="s">Stats Page</text>
  <text x="375" y="216" class="s">Performance</text>
  <text x="375" y="230" class="s">Insights Page</text>
  <text x="375" y="244" class="s">Digest Page</text>

  <!-- Group 4: Social -->
  <rect x="450" y="165" width="130" height="95" rx="8" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" class="page-box"/>
  <text x="515" y="185" class="t">Social</text>
  <text x="515" y="202" class="s">Wishlist Page</text>
  <text x="515" y="216" class="s">Shared Wishlist</text>
  <text x="515" y="230" class="s">Join Page</text>
  <text x="515" y="244" class="s">Notifications</text>

  <!-- Group 5: System -->
  <rect x="590" y="165" width="130" height="95" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" class="page-box"/>
  <text x="655" y="185" class="t">System</text>
  <text x="655" y="202" class="s">Settings Page</text>
  <text x="655" y="216" class="s">Search Page</text>
  <text x="655" y="230" class="s">Envelopes</text>
  <text x="655" y="244" class="s">Loyalty</text>

  <!-- Design System -->
  <rect x="730" y="165" width="120" height="95" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="790" y="185" class="t" style="fill:#fcd34d">Design System</text>
  <text x="790" y="202" class="s">Card · Badge</text>
  <text x="790" y="216" class="s">BudgetBar · Topnav</text>
  <text x="790" y="230" class="s">ScouterGrid · Skeleton</text>
  <text x="790" y="244" class="s">EmptyState · Toast</text>

  <!-- ====== ROW 3: Components ====== -->
  <text x="30" y="278" class="layer-t">Component Groups</text>

  <rect x="30" y="285" width="120" height="55" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="90" y="305" class="t">Mission</text>
  <text x="90" y="320" class="s">MissionCard · MissionForm</text>
  <text x="90" y="333" class="s">TemplateGallery · TemplateCard</text>

  <rect x="158" y="285" width="120" height="55" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1"/>
  <text x="218" y="305" class="t">Options</text>
  <text x="218" y="320" class="s">OptionCard · RadarChart</text>
  <text x="218" y="333" class="s">ComparisonTable · ConstraintChecker</text>

  <rect x="286" y="285" width="120" height="55" rx="6" fill="#1e293b" stroke="#d97706" stroke-width="1"/>
  <text x="346" y="305" class="t">Shopping</text>
  <text x="346" y="320" class="s">ShoppingList · MerchantGroup</text>
  <text x="346" y="333" class="s">PriceHistoryChart · CostBreakdown</text>

  <rect x="414" y="285" width="120" height="55" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1"/>
  <text x="474" y="305" class="t">Charts</text>
  <text x="474" y="320" class="s">Recharts LineChart · BarChart</text>
  <text x="474" y="333" class="s">RadarChart · PriceSparkline</text>

  <rect x="542" y="285" width="120" height="55" rx="6" fill="#1e293b" stroke="#0891b2" stroke-width="1"/>
  <text x="602" y="305" class="t">Forecasting</text>
  <text x="602" y="320" class="s">Forecast graphs · Timeline</text>
  <text x="602" y="333" class="s">PurchaseTimeline · Envelopes</text>

  <rect x="670" y="285" width="180" height="55" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
  <text x="760" y="305" class="t">Accessibility + i18n</text>
  <text x="760" y="320" class="s">ARIA labels · Keyboard shortcuts (N/R/P)</text>
  <text x="760" y="333" class="s">react-i18next EN/FR · Onboarding overlay</text>

  <!-- ====== ROW 4: Hooks ====== -->
  <text x="30" y="358" class="layer-t">Custom Hooks</text>

  <rect x="30" y="365" width="820" height="55" rx="8" fill="#0f172a" stroke="#1d4ed8" stroke-width="1" class="hook-box"/>
  <text x="440" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#93c5fd">React Hooks Layer</text>
  <text x="440" y="402" text-anchor="middle" font-size="10" fill="#64748b">
    useMission · useOptions · useShopping · useResearch · usePriceIntel · useSearch · useSimilarOptions · usePurchase · useNotifications · useTemplates · useKeyboardShortcuts · useOnboarding · useSidebar
  </text>

  <!-- ====== ROW 5: API + State ====== -->
  <text x="30" y="438" class="layer-t">API + State Layer</text>

  <!-- Tanstack Query -->
  <rect x="30" y="445" width="250" height="70" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" class="api-box"/>
  <text x="155" y="468" text-anchor="middle" class="t">Tanstack Query v5</text>
  <text x="155" y="484" class="s">Server state · 30s stale · Suspense</text>
  <text x="155" y="498" class="s">Optimistic updates · Infinite scroll · devtools</text>

  <!-- Zod -->
  <rect x="290" y="445" width="180" height="70" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="380" y="468" text-anchor="middle" class="t">Zod v4 Schemas</text>
  <text x="380" y="484" class="s">Validates all API responses</text>
  <text x="380" y="498" class="s">src/api/ boundary · TypeScript inferred</text>

  <!-- CSS Modules / Theme -->
  <rect x="480" y="445" width="180" height="70" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="570" y="468" text-anchor="middle" class="t">CSS Modules + Theme</text>
  <text x="570" y="484" class="s">theme.css: all SCOUTER tokens</text>
  <text x="570" y="498" class="s">Status badges · Responsive 640/1024px</text>

  <!-- PWA -->
  <rect x="670" y="445" width="180" height="70" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="760" y="468" text-anchor="middle" class="t">PWA + Service Worker</text>
  <text x="760" y="484" class="s">vite-plugin-pwa · Offline cache</text>
  <text x="760" y="498" class="s">Web manifest · installable</text>

  <!-- Arrows connecting layers -->
  <line x1="440" y1="138" x2="440" y2="162" stroke="#334155" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="440" y1="260" x2="440" y2="282" stroke="#334155" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="440" y1="340" x2="440" y2="362" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="440" y1="420" x2="440" y2="442" stroke="#334155" stroke-width="1.5" marker-end="url(#a4)"/>

  <!-- Test badge -->
  <rect x="710" y="86" width="140" height="50" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="780" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#6ee7b7">Testing</text>
  <text x="780" y="124" text-anchor="middle" font-size="9" fill="#6ee7b7">Vitest · jsdom · Testing Library</text>
  <text x="780" y="136" text-anchor="middle" font-size="9" fill="#6ee7b7">71+ tests · 80%+ coverage target</text>
</svg>
