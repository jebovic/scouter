services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scouter
      POSTGRES_PASSWORD: scouter
      POSTGRES_DB: scouter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouter -d scouter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://scouter:scouter@postgres:5432/scouter?sslmode=disable
      ENV: development
      LLM_PROVIDER: routing
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_HEAVY_MODEL: qwen3:14b
      OLLAMA_FAST_MODEL: qwen3:4b
      METRICS_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`scouter.dev.local`) && PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_DISABLE_SW: "true"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`scouter.dev.local`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  traefik:
    image: traefik:v2.11
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/tls.yml:/etc/traefik/tls.yml:ro
      - ./certs:/certs:ro
    depends_on:
      - frontend
      - backend

  seed:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://scouter:scouter@postgres:5432/scouter?sslmode=disable
    entrypoint: ["/app/scouter-seed"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["seed"]

  prometheus:
    image: prom/prometheus:v3.3.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.size=500MB'
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-scouter}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: ["monitoring"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
