groups:
  - name: scouter
    rules:
      - alert: AllLLMModelsDown
        expr: sum(scouter_llm_calls_total{result="error"}) by (model) > 0 and sum(scouter_llm_calls_total{result="success"}) by (model) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "All LLM models are failing"

      - alert: HighLLMLatency
        expr: histogram_quantile(0.95, rate(scouter_llm_call_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM p95 latency > 30s"

      - alert: HighLLMErrorRate
        expr: rate(scouter_llm_calls_total{result="error"}[5m]) / rate(scouter_llm_calls_total[5m]) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM error rate > 30%"

      - alert: BackendDown
        expr: up{job="scouter-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scouter backend is down"
